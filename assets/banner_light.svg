<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Agying3 banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="55%" stop-color="#eaeef2"/>
      <stop offset="100%" stop-color="#d0d7de"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="50%" stop-color="#8250df"/>
      <stop offset="100%" stop-color="#bf3989"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#8250df" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="240" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="240" rx="24" fill="url(#glow)"/>
  <text x="40" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#accent)">Agying3</text>
  <text x="42" y="162" font-family="Consolas, monospace" font-size="16" fill="#656d76">~/Agying3 $ _</text>
  <rect x="170" y="148" width="11" height="18" rx="2" fill="url(#accent)">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.55;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>